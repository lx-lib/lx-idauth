issues:
  exclude-files:
    - ".*_test\\.go$"
  exclude:
    - "the type name `ErrorResponse` should conform to the `XxxError` format"

linters-settings:
  gci:
    custom-order: true
    sections:
      - standard
      - prefix(github.com/nobid-lsp-latvia/lx-idauth)
      - default

linters:
  presets:
    - comment
    - format
    - bugs
    - performance
    - unused
    - test
    - sql

  disable:
    - godox
    - tagalign
    - exhaustruct
    - depguard
    - wrapcheck
    - gochecknoinits
    - varnamelen
    - funlen
    - ireturn
    - mnd
    - interfacebloat
    - gochecknoglobals
    - err113
    - lll
    - nilnil
    - containedctx